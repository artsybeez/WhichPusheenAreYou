<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Fixed-width viewport: phones render the page at desktop width (1100px)
       and zoom the whole thing out to fit, so it looks identical to a big
       screen instead of reflowing into a squished mobile layout. -->
  <meta name="viewport" content="width=1100" />
  <title>Which Pusheen Are You?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" id="container">
    <div class="silhouettes-container" id="silhouettes"></div>
    <div class="content" id="app"></div>
    <div class="popup-overlay" id="popupOverlay" style="display:none">
      <div class="popup" id="popup">
        <button class="popup-close" id="popupClose">&times;</button>
        <div class="popup-char-img" id="popupCharImg"></div>
        <h3 class="popup-name" id="popupName"></h3>
        <p class="popup-fact" id="popupFact"></p>
      </div>
    </div>
    <button class="mute-button" id="muteBtn" aria-label="Toggle music" title="Toggle music">🔊</button>
    <button class="shop-button" id="shopBtn" aria-label="Open skin shop" title="Skin Shop">🛍️</button>
    <div class="shop-overlay" id="shopOverlay" style="display:none">
      <div class="shop">
        <button class="shop-close" id="shopClose">&times;</button>
        <h2 class="shop-title">✦ Skin Shop ✦</h2>
        <p class="shop-sub">Unlock adorable skins for your favorite characters!</p>
        <div class="shop-grid" id="shopGrid"></div>
        <p class="shop-note">🔒 Test mode — pay with card <b>4242 4242 4242 4242</b>, any future expiry &amp; any CVC.</p>
      </div>
    </div>
    <div class="toast" id="toast" style="display:none"></div>
    <div class="welcome-overlay" id="welcomeOverlay">
      <div class="welcome-box">
        <div class="welcome-emoji">Hey visitor!</div>
        <p class="welcome-text">Welcome to my quiz.<br>Hope u like it &lt;3</p>
        <p class="welcome-sign">— Bleta</p>
        <button class="welcome-button" id="welcomeBtn">Let's go!</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
