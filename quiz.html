<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which Pusheen Are You?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" id="container">
    <div class="silhouettes-container" id="silhouettes"></div>
    <div class="content" id="app"></div>
    <div class="popup-overlay" id="popupOverlay" style="display:none">
      <div class="popup" id="popup">
        <button class="popup-close" id="popupClose">&times;</button>
        <div class="popup-char-img" id="popupCharImg"></div>
        <h3 class="popup-name" id="popupName"></h3>
        <p class="popup-fact" id="popupFact"></p>
      </div>
    </div>
    <button class="mute-button" id="muteBtn" aria-label="Toggle music" title="Toggle music">🔊</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
